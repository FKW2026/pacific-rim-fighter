function bar(x,y,w,value,color){rect(x-2,y-2,w+4,11,'#07101a');rect(x,y,w,7,'#252b36');rect(x,y,w*value/100,7,value<28?'#f46168':color);rect(x,y,w,1,'#b8e3df')}
function hud(){const alive=enemies.filter(e=>e.alive).length;text('STRIKER // EUREKA',12,13,7,'#dff9e7');bar(12,17,132,player.hp,C.cyan);text(stages[stageIndex].name,240,13,7,'#dcebe1','center');text(`SCORE ${String(score).padStart(5,'0')}`,468,13,7,C.gold,'right');text(`CORE ${player.core}%`,12,36,6,C.cyan);bar(12,39,68,player.core,C.cyan);if(player.shield>0)text('SHIELD',86,44,6,'#86baff');text(`THREATS ${alive}`,468,32,7,alive?'#ffd2c9':'#8cffba','right');if(combo>1&&comboTimer>0)text(`${combo} HIT COMBO`,240,52,9,C.gold,'center');if(toastTime>0)text(toast,240,65,8,C.cyan,'center');if(gateOpen){text('ZONE CLEAR  →',423,205,7,'#bdffd5','right');rect(452,190,10,29,'#38d3bd');rect(455,194,4,21,'#c4fff2')}}
function drawMenu(){drawBackground();rect(39,46,402,112,'rgba(4,10,19,.89)');rect(39,46,402,2,C.cyan);rect(39,156,402,2,C.gold);drawEnemy({type:'overlord',face:-1,walk:0,attack:0,hurt:0,x:0},356);drawJaeger({face:1,walk:tick*.08,attack:0,hurt:0,jumpHeight:0},119,224);text('JAEGER CLASH',240,78,23,'#efffe9','center');text('BREACHFALL  //  COSMIC CAMPAIGN',240,96,8,C.cyan,'center');text('4 WORLDS • ALIEN WAVES • TITAN BOSS',240,119,8,'#d9e7dc','center');if(Math.floor(tick/24)%2===0)text('PRESS ENTER TO DEPLOY',240,145,9,C.gold,'center');text('A / D OR ← / →  MOVE     W / ↑  JUMP     F  STRIKE     G  HEAVY',240,244,7,'#d4e4dc','center');text('COLLECT POWERUPS  •  Q: REACTOR NOVA WHEN CORE IS FULL',240,258,6,'#8db4bb','center')}
function overlay(title,subtitle){rect(74,79,332,105,'rgba(4,10,19,.94)');rect(74,79,332,2,C.gold);text(title,240,111,17,title.includes('DOWN')?'#ff7880':C.cyan,'center');text(subtitle,240,134,8,'#e4dfc8','center');text('PRESS R TO REDEPLOY',240,158,8,C.gold,'center')}
function draw(){ctx.save();if(shake>1)ctx.translate(rand(Math.ceil(shake))-Math.ceil(shake/2),rand(Math.ceil(shake))-Math.ceil(shake/2));drawBackground();if(state==='menu'){ctx.restore();drawMenu();return}drawPickups();for(const e of enemies){const sx=e.x-camera;if(sx>-60&&sx<W+60&&e.alive)drawEnemy(e,sx)}drawJaeger(player,player.x-camera,FLOOR-player.jumpHeight);drawFx();hud();if(state==='over')overlay('JAEGER DOWN','The breach is still open.');if(state==='win')overlay('COSMIC BREACH SEALED',`FINAL SCORE  ${score}`);ctx.restore()}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script></body></html>
