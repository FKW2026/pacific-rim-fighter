function drawKaiju(e,x){const scale=e.type==='overlord'?1.45:e.type==='brute'?1.2:e.type==='scout'?.82:e.type==='flyer'?.9:1,step=Math.sin(e.walk*2)*3,flap=Math.sin(tick*.42+e.seed)*5,ap=e.attackLen?Math.max(0,Math.sin((1-e.attack/e.attackLen)*Math.PI)):0,skin=e.type==='spitter'?'#4b8790':e.type==='flyer'?'#71518f':e.type==='overlord'?'#784a70':e.type==='sentinel'?'#88715c':'#65516d',dark=e.hurt&&Math.floor(tick/2)%2===0?'#ffc9ac':'#393447',glow=e.type==='flyer'?'#dc9fff':e.type==='spitter'?'#71f0d1':e.type==='overlord'?'#ff7190':'#ed7284';ctx.save();ctx.translate(Math.round(x),Math.round(FLOOR-(e.type==='flyer'?21+Math.sin(tick*.12+e.seed)*9:0)));ctx.scale(e.face*scale,scale);
segment(-9,-33,-11+step*.5,-18,10,dark);segment(-11+step*.5,-18,-13+step,-3,8,skin);segment(9,-33,11-step*.5,-18,10,dark);segment(11-step*.5,-18,14-step,-3,8,skin);box(-23,-68,46,39,dark);box(-20,-70,40,36,skin);box(-16,-65,32,25,glow);box(-12,-62,24,21,skin);for(let i=0;i<4;i++){box(-15+i*8,-56,4,3,dark);box(-14+i*8,-52,3,2,glow)}box(-3,-60,6,13,glow);box(1,-83,22,22,dark);box(4,-86,18,18,skin);box(7,-83,22,13,glow);box(11,-80,15,8,skin);box(22,-80,6,4,'#fff0ad');box(7,-95,4,12,'#b9988c');box(20,-93,4,11,'#b9988c');if(e.type==='flyer'){box(-39,-69+flap,20,5,'#483561');box(-46,-74+flap,11,5,'#bc85e2');box(-39,-58-flap,19,5,'#483561');box(-45,-54-flap,10,4,'#bc85e2')}if(ap>.15){segment(-17,-62,-27-ap*13,-59,10,dark);box(-36-ap*13,-66,12,13,glow)}else{segment(-17,-61,-23+step,-46,9,dark);box(-29+step,-50,11,9,skin)}if(e.type==='overlord'){box(-34,-75,67,9,'#c34467');box(-10,-82,20,20,'#df647a');box(-6,-79,12,11,'#ffd178');for(let i=0;i<5;i++)box(-31+i*16,-88-(i%2)*5,6,5,'#bd81ff')}if(e.type==='sentinel'){box(-24,-75,48,6,'#c28d50');box(-19,-91,38,5,'#a98c65')}ctx.restore();const w=e.type==='overlord'?54:30;box(x-w/2,FLOOR-110,w,4,'#111722');box(x-w/2,FLOOR-110,w*clamp(e.hp/e.max,0,1),3,e.type==='overlord'?'#ff596d':stage().accent)}
function drawEffects(){for(const p of particles){const alpha=clamp(p.life/p.max,0,1);ctx.globalAlpha=alpha;if(p.kind==='dust')box(p.x-cam,p.y,p.size*2,p.size,p.color);else box(p.x-cam,p.y,p.size,p.size,p.color)}ctx.globalAlpha=1;for(const b of projectiles){const x=b.x-cam;ctx.save();ctx.shadowColor=b.kind==='acid'?'#aaff72':b.kind==='fire'?'#ff875a':'#d89cff';ctx.shadowBlur=8;box(x-3,b.y-3,7,7,b.kind==='acid'?'#aaff72':b.kind==='fire'?'#ff875a':'#d89cff');box(x-1,b.y-1,3,3,'#fff3d4');ctx.restore()}}
function drawPickups(){for(const p of pickups){if(p.taken)continue;const x=p.x-cam,y=FLOOR-29+Math.sin((tick+p.phase)*.08)*3,col=p.type==='med'?'#86ffac':p.type==='core'?C.cyan:'#78aaff';ctx.save();ctx.shadowColor=col;ctx.shadowBlur=8;box(x-7,y-7,14,14,'#111927');box(x-5,y-5,10,10,col);ctx.shadowBlur=0;if(p.type==='med'){box(x-1,y-4,3,8,'#effff0');box(x-4,y-1,8,3,'#effff0')}else box(x-1,y-4,3,8,'#effff0');ctx.restore()}}
function label(str,x,y,size,color,align='left'){ctx.font=`bold ${size}px monospace`;ctx.textAlign=align;ctx.fillStyle='#080d17';ctx.fillText(str,x+1,y+1);ctx.fillStyle=color;ctx.fillText(str,x,y)}
function drawHUD(){const alive=enemies.filter(e=>e.alive).length;label('EUREKA  //  MARK-IV',12,12,7,'#effff2');box(10,15,136,10,'#07101a');box(12,17,132,6,'#26303b');box(12,17,132*player.hp/100,6,player.hp<28?C.red:C.cyan);label('HP',149,23,6,'#b8c5c6');label(stage().name,240,12,7,'#e5f1e7','center');label(String(score).padStart(6,'0')+'  SCORE',468,12,7,C.gold,'right');label('CORE',12,35,6,C.cyan);box(40,30,69,6,'#202938');box(41,31,67*player.core/100,4,C.cyan);if(player.shield)label('SHIELD',116,36,6,'#90bfff');label('HOSTILES  '+alive,468,29,7,alive?'#ffd3c9':'#8cffba','right');if(combo>1&&comboTimer)label(`${combo} HIT  //  COMBO`,240,49,9,C.gold,'center');if(toastTime)label(toast,240,63,7,C.cyan,'center');if(gateOpen){label('SECTOR SECURE  →',433,205,7,'#c3ffdc','right');box(454,190,9,29,'#38d3bd');box(457,194,3,21,'#c4fff2')}if(bossBar){box(121,69,238,9,'#10121d');box(123,71,234,5,'#352438');box(123,71,234*bossBar.hp/bossBar.max,5,'#ff5577');label('BREACH TITAN',240,67,6,'#ffd3d2','center')}}
function drawMenu(){drawBackground();box(34,39,412,130,'rgba(4,10,19,.93)');box(34,39,412,2,C.cyan);box(34,167,412,2,C.gold);drawJaeger({face:1,walk:tick*.08,vx:1,attack:0,attackLen:0,air:false,jumpY:0,land:0,hurt:0,heavy:false,shield:0},111,FLOOR);label('JAEGER',275,71,22,'#f1fff0','center');label('BREACHFALL',275,91,11,C.cyan,'center');label('FOUR FRONTLINES. ONE LAST STAND.',275,108,7,'#d4e4dc','center');label('PRESS ENTER TO DEPLOY',275,133,8,C.gold,'center');label('MOVE  A / D  or  ← / →',120,197,7,'#dbe9e5');label('JUMP  W / ↑',120,210,7,'#dbe9e5');label('QUICK STRIKE  F / SPACE     HEAVY  G',120,223,7,'#dbe9e5');label('DODGE  SHIFT / X     REACTOR NOVA  Q',120,236,7,'#dbe9e5');label('COLLECT REPAIR, CORE & SHIELD DROPS',240,258,6,'#8db4bb','center')}
function drawOverlay(){box(68,77,344,112,'rgba(4,9,18,.95)');box(68,77,344,2,C.gold);label(state==='win'?'BREACH CONTAINED':'JAEGER DOWN',240,111,17,state==='win'?C.cyan:'#ff7880','center');label(state==='win'?`CAMPAIGN SCORE  ${score}`:'The frontline is lost. Re-enter the breach.',240,134,8,'#e4dfc8','center');label('PRESS R TO REDEPLOY',240,162,8,C.gold,'center')}
function draw(){ctx.save();if(shake>1)ctx.translate(rand(Math.ceil(shake))-shake/2,rand(Math.ceil(shake))-shake/2);drawBackground();if(state==='menu'){ctx.restore();drawMenu();return}drawPickups();for(const e of enemies){const x=e.x-cam;if(e.alive&&x>-60&&x<W+60)drawKaiju(e,x)}drawJaeger(player,player.x-cam,FLOOR-player.jumpY);drawEffects();drawHUD();if(state==='over'||state==='win')drawOverlay();ctx.restore()}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
